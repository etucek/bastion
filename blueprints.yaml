name: Bastion
slug: bastion
type: theme
version: 1.1.2
description: A Tailwind CSS 4 Grav theme, built independently from Quark 2, compiled with the tailwind4 plugin - no Node.js toolchain required.
icon: bolt
author:
  name: Emir Tucek
  email: emir@tucek.me
homepage: https://github.com/etucek/bastion
keywords: grav, theme, bastion, tailwind, tailwindcss
bugs: https://github.com/etucek/bastion/issues
license: MIT
compatibility:
  grav: ['2.1']
dependencies:
  - { name: grav, version: '>=2.1.0' }
  - { name: color-tools, version: ">=1.1.1" }
  - { name: shortcode-core, version: ">=4.0.0" }
  - { name: bastion-gallery, version: ">=3.1.0" }
form:
  validation: loose

  fields:

    theme-mode:
      type: select
      label: Theme Mode Default
      help: Default appearance before a user makes a choice. Users can still toggle in the UI.
      size: small
      default: auto
      options:
        auto: Auto (follows OS)
        light: Light
        dark: Dark

    accent-color:
      type: colorpicker
      label: Accent Color
      help: Tints links and focus rings. Leave blank for the pure monochrome palette.
      default: '#A664E8'

    header_section:
      type: section
      title: Header
      underline: true

    custom_favicon:
      type: file
      label: Custom Favicon
      help: Saved to user/themes/bastion/images/favicon. Accepts .png, .svg or .ico. Falls back to the theme default when empty.
      size: large
      destination: 'theme://images/favicon'
      multiple: false
      accept:
        - image/*
        - .ico

    custom_logo:
      type: file
      label: Custom Logo
      help: Saved to user/themes/bastion/images/logo. The file stays put across theme updates.
      size: large
      destination: 'theme://images/logo'
      multiple: false
      markdown: true
      accept:
        - image/*

    custom_logo_mobile:
      type: file
      label: Custom Logo (Mobile)
      help: Saved to user/themes/bastion/images/logo. The file stays put across theme updates.
      size: large
      destination: 'theme://images/logo'
      multiple: false
      accept:
        - image/*

    header-fixed:
      type: toggle
      label: Header Fixed
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header-animated:
      type: toggle
      label: Header Animated
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header-transparent:
      type: toggle
      label: Header Transparent (hero pages)
      help: Lets the hero show through the header until the visitor scrolls.
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header-dark:
      type: toggle
      label: Header Text Light
      help: Draws the header text in white while it sits over a dark hero image.
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header-light:
      type: toggle
      label: Header Text Dark
      help: Draws the header text in near-black while it sits over a light hero image.
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    footer_section:
      type: section
      title: Footer
      underline: true

    sticky-footer:
      type: toggle
      label: Sticky Footer
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    footer.copyright:
      type: editor
      label: Copyright
      help: Markdown/HTML shown next to the logo at the bottom of the footer.
      size: large

    footer.menu_enabled:
      type: toggle
      label: Show Footer Links
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    footer.menu:
      type: list
      label: Footer Links
      collapsed: true
      style: vertical
      fields:
        .label:
          type: text
          label: Label
        .link:
          type: text
          label: Link
        .newtab:
          type: toggle
          label: Open in New Tab
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

    footer.social_enabled:
      type: toggle
      label: Show Social Links
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    footer.social:
      type: list
      label: Social Links
      collapsed: true
      style: vertical
      fields:
        .network:
          type: text
          label: Network
          help: 'A Font Awesome brand icon name, e.g. twitter, github, linkedin, facebook, instagram, youtube, mastodon'
        .link:
          type: text
          label: Link
          placeholder: 'https://socialnetwork.com/username'
        .newtab:
          type: toggle
          label: Open in New Tab
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

    blog_section:
      type: section
      title: Blog
      underline: true

    blog-page:
      type: text
      label: Blog Page Route
      size: medium
      default: '/blog'

    login_section:
      type: section
      title: Login
      underline: true

    login.enabled:
      type: toggle
      label: Show Login / Logout
      help: Shows a login icon in the header for anonymous visitors, and username + logout once signed in. Requires the Login plugin to be installed and enabled.
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    langswitcher_section:
      type: section
      title: Language Switcher
      underline: true

    langswitcher.enabled:
      type: toggle
      label: Show Language Switcher
      help: Shows a language switcher dropdown in the header. Requires the Langswitcher plugin to be installed and enabled, and more than one language configured.
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
