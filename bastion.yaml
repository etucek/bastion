#
# Theme-shipped defaults - a starting point for a new install, not this
# site's actual configuration. Anything you change in Admin (or in
# user/config/themes/bastion.yaml) overrides these without editing this
# file, and survives theme updates; this file does not.
#
enabled: true
header-fixed: true
header-animated: true
header-transparent: false
header-dark: false
header-light: false
sticky-footer: true
theme-mode: auto
accent-color: '#A664E8'
blog-page: '/blog'

login:
  enabled: true
langswitcher:
  enabled: true

footer:
  copyright: "&copy; My Site. All rights reserved."
  menu_enabled: false
  menu: []
  social_enabled: false
  social: []

tailwind4:
  input: css/site.css
  output: build/css/site.css
