title: Post
extends@: default

form:
  fields:
    tabs:
      fields:

        options:
          fields:
            section_tags:
              type: section
              title: THEME_BASTION.BLUEPRINTS.TAGS
              underline: true

              fields:
                header.taxonomy.tag_post:
                  type: selectize
                  label: THEME_BASTION.BLUEPRINTS.TAGS
                  size: small
                  data-options@: '\Grav\Theme\Bastion::tagOptionsPost'
                  validate:
                    type: array

        post:
          type: tab
          title: THEME_BASTION.BLUEPRINTS.POST
          ordering@: 2

          fields:

            blog_layout_section:
              type: section
              title: THEME_BASTION.BLUEPRINTS.LAYOUT_CONFIGURATION
              underline: true
              ordering@: 1

              import@:
                type: partials/blog
