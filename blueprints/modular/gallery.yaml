title: Gallery
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.media_order:
              ordering@: 99

            section_title:
              type: section
              ordering@: 2
              import@:
                type: modular/partials/title

            header.gallery.grid_classes:
              type: text
              default: 'grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-y-2 gap-x-2'
              label: THEME_BASTION.BLUEPRINTS.GRID_CLASSES
              help: THEME_BASTION.BLUEPRINTS.GRID_CLASSES_HELP

            header.gallery.thumb.width:
              type: number
              label: THEME_BASTION.BLUEPRINTS.THUMBNAIL_WIDTH
              size: x-small
              append: px
              default: 600

            header.gallery.thumb.height:
              type: number
              label: THEME_BASTION.BLUEPRINTS.THUMBNAIL_HEIGHT
              size: x-small
              append: px
              default: 450

            header.gallery.items:
              type: list
              style: vertical
              label: THEME_BASTION.BLUEPRINTS.GALLERY_ITEMS

              fields:
                .title:
                  type: text
                  label: THEME_BASTION.BLUEPRINTS.TITLE
                .image:
                  type: filepicker
                  preview_images: true
                  label: THEME_BASTION.BLUEPRINTS.IMAGE
                .desc:
                  type: textarea
                  rows: 4
                  label: THEME_BASTION.BLUEPRINTS.DESCRIPTION
                .video:
                  type: text
                  label: THEME_BASTION.BLUEPRINTS.VIDEO
                  help: THEME_BASTION.BLUEPRINTS.VIDEO_HELP
