title: Image Block
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.media_order:
              ordering@: 99

            section_title:
              type: section
              ordering@: 2
              import@:
                type: modular/partials/title

            header.image:
              type: filepicker
              toggleable: true
              preview_images: true
              label: THEME_BASTION.BLUEPRINTS.IMAGE

            header.image_align:
              type: toggle
              toggleable: true
              label: THEME_BASTION.BLUEPRINTS.IMAGE_ALIGN
              default: right
              highlight: right
              size: medium
              options:
                left: THEME_BASTION.BLUEPRINTS.LEFT_SIDE
                right: THEME_BASTION.BLUEPRINTS.RIGHT_SIDE
