title: Blog
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.media_order:
              ordering@: 99

        blog:
          type: tab
          title: THEME_BASTION.BLUEPRINTS.BLOG_CONFIGURATION
          ordering@: 2

          fields:

            blog_config_section:
              type: section
              title: THEME_BASTION.BLUEPRINTS.BLOG_CONFIGURATION
              underline: true

              fields:
                header.content.items:
                  type: textarea
                  yaml: true
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ITEMS
                  # See the identical field in recipes.yaml for why this is
                  # a list, not a bare '@self.children' scalar.
                  default:
                    - self@.children
                  validate:
                    required: true
                    type: yaml

                header.content.filter:
                  type: textarea
                  yaml: true
                  label: THEME_BASTION.BLUEPRINTS.BLOG_FILTER
                  placeholder: 'published: true'
                  validate:
                    required: false
                    type: yaml

                header.content.limit:
                  type: number
                  label: THEME_BASTION.BLUEPRINTS.BLOG_MAX_ITEM_COUNT
                  default: 10
                  validate:
                    required: true
                    type: int
                    min: 1

                header.content.order.by:
                  type: select
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY
                  default: date
                  options:
                    folder: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_FOLDER
                    title: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_TITLE
                    date: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_DATE
                    default: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_DEFAULT

                header.content.order.dir:
                  type: select
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ORDER
                  default: desc
                  options:
                    asc: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_ASC
                    desc: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_DESC

                header.content.grid_classes:
                  toggleable: true
                  type: text
                  label: THEME_BASTION.BLUEPRINTS.GRID_CLASSES
                  help: THEME_BASTION.BLUEPRINTS.GRID_CLASSES_HELP
                  default: 'grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6'

            blog_layout_section:
              type: section
              title: THEME_BASTION.BLUEPRINTS.LAYOUT_CONFIGURATION
              underline: true
              ordering@: 1

              import@:
                type: partials/blog
