title: Recipes
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.media_order:
              ordering@: 99

        recipes:
          type: tab
          title: THEME_BASTION.BLUEPRINTS.RECIPES
          ordering@: 2

          fields:

            recipes_config_section:
              type: section
              title: THEME_BASTION.BLUEPRINTS.RECIPES_CONFIGURATION
              underline: true

              fields:
                header.content.items:
                  type: textarea
                  yaml: true
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ITEMS
                  # A bare '@self.children' scalar round-trips through this
                  # yaml:true field as an unquoted document root - '@' is a
                  # reserved YAML indicator that can't start one, so Admin's
                  # own dump of its own default broke saving with "end of
                  # the stream or a document separator is expected (1:1)".
                  # The list form (self@ prefix, not @self) sidesteps it:
                  # the list marker starts the document, not the scalar.
                  default:
                    - self@.children
                  validate:
                    required: true
                    type: yaml

                header.content.filter:
                  type: textarea
                  yaml: true
                  label: THEME_BASTION.BLUEPRINTS.BLOG_FILTER
                  placeholder: 'published: true'
                  validate:
                    required: false
                    type: yaml

                header.content.limit:
                  type: number
                  label: THEME_BASTION.BLUEPRINTS.BLOG_MAX_ITEM_COUNT
                  default: 12
                  validate:
                    required: true
                    type: int
                    min: 1

                header.content.order.by:
                  type: select
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY
                  default: date
                  options:
                    folder: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_FOLDER
                    title: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_TITLE
                    date: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_DATE
                    default: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_BY_DEFAULT

                header.content.order.dir:
                  type: select
                  label: THEME_BASTION.BLUEPRINTS.BLOG_ORDER
                  default: desc
                  options:
                    asc: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_ASC
                    desc: THEME_BASTION.BLUEPRINTS.BLOG_ORDER_DESC

            recipes_layout_section:
              type: section
              title: THEME_BASTION.BLUEPRINTS.LAYOUT_CONFIGURATION
              underline: true
              ordering@: 1

              import@:
                type: partials/recipes
