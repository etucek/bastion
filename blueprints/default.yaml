title: Default
extends@: default

form:
  fields:
    tabs:
      fields:
        advanced:
          fields:
            # Same restriction as onAdminPageTypes (bastion.php) applied to
            # the "Page Template" field here too - that event only filters
            # the picker shown when *creating* a page; this dropdown is how
            # an *existing* page's template gets changed, a separate
            # data-options@ call that bypasses the event entirely.
            columns:
              fields:
                column1:
                  fields:
                    name:
                      data-options@: '\Grav\Theme\Bastion::pageTypes'

            section_layout:
              type: section
              title: THEME_BASTION.BLUEPRINTS.LAYOUT_CLASSES
              underline: true
              ordering@: 1

              import@:
                type: partials/layout

            section_colors:
              type: section
              title: THEME_BASTION.BLUEPRINTS.COLORS
              underline: true
              ordering@: 1

              import@:
                type: partials/colors

        hero:
          title: THEME_BASTION.BLUEPRINTS.HERO
          type: tab
          ordering@: 1

          import@:
            type: partials/hero

        options:
          fields:
            section_comments:
              type: section
              title: THEME_BASTION.BLUEPRINTS.COMMENTS_CONFIGURATION
              underline: true

              fields:
                header.comments:
                  type: toggle
                  toggleable: true
                  label: THEME_BASTION.BLUEPRINTS.ENABLE_COMMENTS
                  help: THEME_BASTION.BLUEPRINTS.ENABLE_COMMENTS_HELP
                  highlight: 1
                  size: medium
                  default: 0
                  options:
                    1: PLUGIN_ADMIN.YES
                    0: PLUGIN_ADMIN.NO
                  validate:
                    type: bool
